[package]
name = "local-ai"
version = "0.2.1"
description = "My Own AI desktop app"
authors = ["Julien Aerts"]
license = "GPL-3.0-or-later"
repository = "https://github.com/JulienAerts/my-own-ai"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-log = "2"
# Web search and page reading from the app, outside the browser's CORS rules.
# unsafe-headers: send a normal browser User-Agent.
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
# Native engine (llama.cpp): downloads, unpacking, server process.
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Linux and macOS builds of llama.cpp come as .tar.gz.
tar = "0.4"
flate2 = "1"
# Updates from GitHub Releases, signed with the project's key; restart after installing.
tauri-plugin-updater = "2.13"
tauri-plugin-process = "2.4"
# Links (in answers, settings, bug reports) open in the system browser.
tauri-plugin-opener = "2.7"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }
# Folder picker for workspace folders.
tauri-plugin-dialog = "2"
# Always ready: global shortcut, start with Windows.
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"

# Detect AMD/Intel GPUs and their memory from the display driver registry keys.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
